#Lists all services
services:
  frontend:
    #names the container
    container_name: frontend_container
    #specifices the Dockerfile location for the build
    build: ./web
    #maps port 3001 on localhost to port 3000 inside the container (3000 was already allocated by another container)
    ports:
      - 3001:3000
    #on the network "mynet" — required for inter-container DNS resolution
    networks:
      - mynet

  backend:
    container_name: backend_container
    #Build location of Dockerfile is ./backend
    build: ./backend
    #Mapping port 4000 to 4000
    ports:
      - 4000:4000
    #You can set environment variables here for your app
    environment:
      #Aligned with process.env.PG_* variable names used in data-source.ts
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USERNAME: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: postgres
      REDIS_URL: redis://redis:6379
      PORT: 4000
      #Required by express-session; inject via secrets manager in production
      SESSION_SECRET: change_me_in_production
      #Required by cors middleware; update to match your frontend origin in production
      CORS_ORIGIN: http://localhost:3001
    #Specifices that this service depends on the postgres service
    depends_on:
      postgres:
        #ensures that the service is running before a connection is attempted.
        #if this line is removed, the first time you run docker-compose up --build,
        #the backend will attempt the typeorm connection to postgres before the database is ready
        #for connections. this health check will make it wait until the db is ready
        condition: service_healthy
    #links to postgres and redis services
    links:
      - postgres
      - redis
    #on the network "mynet"
    networks:
      - mynet
    #anonymous volume removed — node_modules baked into the image by RUN yarn are sufficient.
    #adding it back shadows the image layer and causes "Cannot find module" on restart.

  postgres:
    container_name: postgres
    #pinned to postgres 17 — latest stable major version as of 2025
    image: postgres:17
    #Volume will restart on failure
    restart: always
    #More environment variables
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    #port 5432 mapped to 5432
    ports:
      - "5432:5432"
    #volume postgres-data mapped from /var/lib/postgresql/data, the default location for postgresql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    #created a network for the service. will be default if not specified.
    networks:
      - mynet
    #runs the health check required by the backend.
    #if this is removed, the very first build will have a failed connections, but
    #future builds will not. this healthcheck ensures a successful first postgres connection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - mynet
    #maps volume pgadmin-data from /var/lib/pgadmin, the default location
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redis:
    image: redis
    container_name: redis
    #port may need to be exposed for certain applications
    #6379 is the default redis port
    expose:
      - 6379
    ports:
      - 6379:6379
    networks:
      - mynet
    #maps volume redis-data from /data, the default location
    volumes:
      - redis-data:/data

#lists the volumes needed for this docker-compose file. will be using local drivers
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

#User defined bridges provide automatic DNS resolution between containers on the network
networks:
  mynet:
    driver: bridge
